# PEP 517/518 build backend. Required so PEP 621 [project] metadata below is
# honored: with this table absent, pip falls back to setuptools.build_meta:__legacy__
# plus whatever setuptools the host has. On Ubuntu 22.04 stock (setuptools 59.6,
# pre-PEP 621) that silently builds an UNKNOWN-0.0.0 wheel and drops every
# [project.dependencies] entry. Pinning setuptools>=61 forces a backend that
# actually parses [project].
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldjy-retargeting"
version = "0.1.0"
description = "LDJY hand pose retargeting with adaptive analytical optimization"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
dependencies = [
    "mediapipe==0.10.21",
    "numpy>=1.21.0",
    "nlopt",
    "opencv-python",
    "pin>=3.8.0",
    "pyyaml",
    "scipy>=1.11.0",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
realsense = [
    "pyrealsense2",
]
zed = [
    "pyzed",
]
tuning = [
    "mujoco>=3.6",
]
gui = [
    "PySide6-Essentials>=6.8",
]
wilor = [
    "PySide6-Essentials>=6.8",
    "chumpy @ git+https://github.com/mattloper/chumpy.git",
    "dill>=0.3,<0.4",
    "einops>=0.7,<0.9",
    "mujoco>=3.6",
    "pytorch-lightning>=2.4,<2.6",
    "pyrender>=0.1.45",
    "scikit-image>=0.22,<0.26",
    "smplx==0.1.28",
    "timm==0.9.16",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "trimesh>=4.4,<5",
    "ultralytics==8.1.34",
    "yacs>=0.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["ldjy_retargeting*"]

# ponytail: MediaPipe 0.10.21 is the last release with solutions.hands; it runs
# with NumPy 2, but its stale metadata says NumPy < 2. Migrate camera inputs to
# the MediaPipe Tasks API when its model-asset lifecycle is implemented.
[tool.uv]
override-dependencies = ["numpy>=2"]

# Upstream chumpy's legacy setup.py imports pip during its wheel build.
[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.setuptools.package-data]
"ldjy_retargeting" = [
    "assets/robots/**/*.urdf",
    "assets/robots/**/*.xml",
    "assets/robots/**/*.stl",
]
