optimizer:
  type: ManusFullSkeletonRetargeter
retarget:
  position_scale_m: 0.01
  direction_scale: 0.1
  rotation_scale_deg: 10.0
  position_weight: 1.0
  direction_weight: 0.5
  rotation_weight: 0.5
  temporal_scale_rad: 0.1
  temporal_weight: 0.05
  zero_weight: 0.001
  max_nfev: 30
  lp_alpha: 0.15
render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
tip_offsets:
  thumb: {axis_mm: 0.0, surface_mm: 0.0}
  finger1: {axis_mm: 0.0, surface_mm: 0.0}
  finger2: {axis_mm: 0.0, surface_mm: 0.0}
  finger3: {axis_mm: 0.0, surface_mm: 0.0}
  finger4: {axis_mm: 0.0, surface_mm: 0.0}
